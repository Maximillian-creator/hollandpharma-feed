name: Holland Pharma Feed Updater

# Prijs + voorraad van de witte lijst (scraper.py). Geen inlog nodig: de pagina's tonen
# adviesprijs en voorraadbalk ook uitgelogd. Op :41 en niet op het hele uur (GitHub drukst);
# 19:41 UTC is ook met 6 uur vertraging vóór de Stock Sync-run van 04:00 NL klaar.
on:
  schedule:
    - cron: "41 19 * * *"
    - cron: "41 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper.py", "hp.py", "witte_lijst.txt", "requirements.txt", ".github/workflows/update_feed.yml"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q test_feed.py
      - name: Scraper draaien
        run: python scraper.py
      - name: XML committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hollandpharma_feed.xml
          git diff --staged --quiet || git commit -m "🔄 Feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
